<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Grocery Scanner</title>
    <link rel="manifest" href="manifest.json">
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" rel="stylesheet">
    
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; padding: 20px; max-width: 600px; margin: 0 auto; }
        .btn { background-color: #4CAF50; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; margin-top: 10px; width: 100%; }
        .btn:disabled { background-color: #ccc; cursor: not-allowed; }
        .item-row { display: flex; justify-content: space-between; align-items: center; background: #f9f9f9; padding: 10px; margin-bottom: 8px; border-radius: 5px; border: 1px solid #eee; }
        .item-text { flex-grow: 1; margin-right: 15px; font-weight: bold;}
        select { padding: 5px; border-radius: 4px; }
        #loading { display: none; color: #ff9800; font-weight: bold; margin-top: 10px; text-align: center; }
        
        /* Cropper Styles */
        #cropContainer { display: none; margin-top: 15px; margin-bottom: 15px; border: 2px dashed #ccc; padding: 5px; }
        #imageToCrop { max-width: 100%; display: block; }
    </style>
</head>
<body>

    <h2>Scan Receipt</h2>
    <p>1. Take a photo. <br>2. Crop it to <b>only</b> show the quantities and item names. <br>3. Scan!</p>

    <input type="file" id="receiptImage" accept="image/*" capture="environment" style="margin-bottom: 10px;">
    
    <div id="cropContainer">
        <img id="imageToCrop" src="">
    </div>

    <button id="scanBtn" class="btn" style="display:none;">Crop & Scan</button>
    <p id="loading">Scanning cropped area... Please wait.</p>

    <div id="resultsArea" style="display:none; margin-top: 20px;">
        <h3>Categorize Items</h3>
        <div id="itemList"></div>
        <button class="btn" style="background-color: #2196F3; margin-top: 15px;">Save to Pantry</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
    
    <script src="app.js"></script>

</body>
</html>
